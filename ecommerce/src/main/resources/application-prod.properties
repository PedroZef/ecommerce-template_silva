# Configuração do Banco de Dados MySQL para Produção
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desabilitar console H2 em produção
spring.h2.console.enabled=false

# Ativar Flyway para gerenciamento de migrations em produção
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT Security key - MUST be provided in production environment
jwt.secret=${JWT_SECRET}
