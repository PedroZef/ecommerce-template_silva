spring.application.name=ecommerce

server.port=8080

# Importa o arquivo .env nativamente como propriedades
spring.config.import=optional:file:.env[.properties]


# Define o Spring Profile ativo por padrão. Se for passado via argumento (--spring.profiles.active=prod), ele muda para prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# H2 Console (Habilitado globalmente para facilitar desenvolvimento)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Outras configurações comuns
spring.thymeleaf.cache=false
spring.jpa.open-in-view=false

# Configuração do Swagger para documentar apenas as rotas de API REST
springdoc.paths-to-match=/api/**

# Spring AI - Configuração Principal do Chat (OpenRouter)
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
spring.ai.openai.chat.options.model=google/gemini-2.5-flash
spring.ai.openai.chat.options.max-tokens=1000
spring.ai.retry.max-attempts=1
groq.api-key=${GROQ_API_KEY:}



# Configurações de upload de arquivos de áudio
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

