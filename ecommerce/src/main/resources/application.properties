spring.application.name=ecommerce

server.port=8080

# Define o Spring Profile ativo por padrão. Se for passado via argumento (--spring.profiles.active=prod), ele muda para prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# H2 Console (Habilitado globalmente para facilitar desenvolvimento)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Outras configurações comuns
spring.thymeleaf.cache=false
spring.jpa.open-in-view=false

# Configuração do Swagger para documentar apenas as rotas de API REST
springdoc.paths-to-match=/api/**

# Spring AI (Configuração da API Groq usando adaptador OpenAI)
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.audio.transcription.enabled=true
spring.ai.openai.chat.options.model=llama-3.1-8b-instant
spring.ai.openai.audio.transcription.base-url=https://api.groq.com/openai/v1
spring.ai.openai.audio.transcription.options.model=whisper-large-v3
spring.ai.retry.max-attempts=1
spring.ai.openai.api-key=${GROQ_API_KEY}

# Configurações de upload de arquivos de áudio
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

